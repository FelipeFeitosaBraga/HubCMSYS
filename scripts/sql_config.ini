; ======================================================================
;  ARQUIVO DE CONFIGURACAO DA INSTALACAO SILENCIOSA - SQL SERVER 2025 EXPRESS
; ----------------------------------------------------------------------
;  Usado pelo botao 4 (4_instalar_sql.bat): setup.exe /ConfigurationFile=...
;  Os valores reproduzem a instalacao manual do manual da Azure
;  (conferidos no Summary/Settings.xml de uma instalacao real).
;  A senha do "sa" NAO fica aqui: o .bat passa /SAPWD na linha de comando.
;  Linhas que comecam com ponto e virgula sao comentarios.
; ======================================================================
[OPTIONS]

; O que fazer: instalar.
ACTION="Install"

; Perfil padrao do instalador (igual ao gerado pelo assistente grafico).
ROLE="AllFeatures_WithDefaults"

; Sem janelas: instalacao silenciosa.
QUIET="True"

; Mostra o andamento no CMD enquanto instala.
INDICATEPROGRESS="True"

; Aceita o termo de licenca (equivale ao "Aceito" do assistente).
IACCEPTSQLSERVERLICENSETERMS="True"

; Nao exibe avisos de privacidade/edicao paga (travariam a instalacao silenciosa).
SUPPRESSPRIVACYSTATEMENTNOTICE="True"
SUPPRESSPAIDEDITIONNOTICE="True"

; Nao procura atualizacoes do produto durante a instalacao (evita demora).
; As atualizacoes do Windows ficam por conta do botao 6.
UpdateEnabled="False"

; Recursos marcados no manual:
;   SQLENGINE        = Servicos de Mecanismo de Banco de Dados
;   REPLICATION      = Replicacao do SQL Server
;   ADVANCEDANALYTICS= Servicos de IA e Extensoes de Linguagem
;   FULLTEXT         = Extracoes Semanticas e de Texto Completo
;   LOCALDB          = LocalDB
; (PolyBase fica de fora, como no manual.)
FEATURES=SQLENGINE,REPLICATION,ADVANCEDANALYTICS,FULLTEXT,LOCALDB

; Instancia padrao (sem nome), como no manual.
INSTANCENAME="MSSQLSERVER"
INSTANCEID="MSSQLSERVER"

; Modo de autenticacao MISTO (SQL Server + Windows). A senha do sa vem do .bat.
SECURITYMODE="SQL"

; Adiciona o usuario que esta instalando como administrador do SQL.
ADDCURRENTUSERASSQLADMIN="True"

; Ordenacao (collation) fixa, igual a da instalacao de referencia. Fixar evita
; depender do idioma do Windows do cliente (importante para restaurar o .bak).
SQLCOLLATION="Latin1_General_CI_AS"

; "Conceder privilegio Realizar Tarefa de Manutencao de Volume" (marcado no manual).
SQLSVCINSTANTFILEINIT="True"

; SQL Server Browser em Automatico (alterado de Desabilitado no manual).
BROWSERSVCSTARTUPTYPE="Automatic"

; Servico do banco inicia junto com o Windows.
SQLSVCSTARTUPTYPE="Automatic"

; Habilita TCP/IP e Pipes nomeados ja na instalacao (1 = ligado). Na instalacao
; manual eles vinham desligados e eram ligados depois no Gerenciador de Configuracao.
TCPENABLED="1"
NPENABLED="1"
